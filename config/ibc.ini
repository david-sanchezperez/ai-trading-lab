# IBC config for IB Gateway paper account
# Credentials are NOT stored here — loaded from ~/.env at runtime
# IbDir intentionally omitted: IBC uses ~/Jts by default (recommended)
#
# Para aplicar cambios:
#   sudo cp config/ibc.ini /opt/ibc/config.ini

[IBController]
TradingMode=paper
AcceptIncomingConnectionAction=accept
AcceptNonBrokerageAccountWarning=yes
MinimizeMainWindow=yes
IbApiPort=4002
CommandServerPort=7462

# Cuando IBKR detecta una sesión anterior activa al reiniciar (ej. después del
# daily disconnect a las 23:45 CET), muestra un diálogo que IBC no puede manejar
# sin esta opción → timeout → loop de reinicios. "primaryoverride" toma el control
# de la sesión anterior automáticamente.
ExistingSessionDetectedAction=primaryoverride
